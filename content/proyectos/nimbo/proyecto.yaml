      es: Tiempo en Tokio con el tema soleado, la previsión de las próximas horas, los próximos 7 días y los datos de viento, humedad, UV, presión, amanecer y atardecer
      en: Weather in Tokyo with the sunny theme, the hourly forecast, the next 7 days and wind, humidity, UV, pressure, sunrise and sunset data
      ca: 'Temps a Tòquio amb el tema assolellat, la previsió de les pròximes hores, els pròxims 7 dies i les dades de vent, humitat, UV, pressió, sortida i posta del sol'
