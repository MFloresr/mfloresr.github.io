      es: Tiempo en Singapur con llovizna, que cambia la página al tema de lluvia en azul petróleo
      en: Weather in Singapore with drizzle, which switches the page to the teal rain theme
      ca: 'Temps a Singapur amb plugim, que canvia la pàgina al tema de pluja en blau petroli'
