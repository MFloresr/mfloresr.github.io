# Catálogo de tecnologías.
# - destacada: true  → declarada por Mario como parte de su perfil (se muestra en primer plano).
# - destacada: false → usada en alguno de sus proyectos publicados.
# Los proyectos solo pueden citar ids de esta lista (se comprueba al compilar).
# grupo: backend | frontend | datos | infraestructura | herramientas | ia
# Opcionales:
# - incluye: [ids]  → "dónde la uso" suma los proyectos que usan esas tecnologías (p. ej. Bases de datos → PostgreSQL)
# - nombre puede ser { es, en, ca, fr } cuando el nombre se traduce (p. ej. Bases de datos → Databases)
# - contexto: {es, en, ca, fr} → dónde la uso cuando no aparece en ningún proyecto (solo lo que Mario ha confirmado)

